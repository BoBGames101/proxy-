<!DOCTYPE html>
<html>
<head>
    <title>Math Assignment</title>
</head>
<body style="margin:0; overflow:hidden;">
    <!-- This uses a 'cors-anywhere' style trick to fetch the content -->
    <iframe id="proxy" style="width:100vw; height:100vh; border:none;"></iframe>

    <script>
        const target = "https://minnit.chat";
        // We use a bridge to get around the 'Refused to Connect' error
        document.getElementById('proxy').src = "https://allorigins.win" + encodeURIComponent(target);
    </script>
    <iframe src="https://minnit.chat" 
        style="border:none;width:100%;height:100vh;" 
        allow="autoplay; encrypted-media" 
        allowfullscreen>
</iframe>

</body>
</html>
